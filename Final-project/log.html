<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>The Cozy Nook | User Log</title>
  <meta name="description" content="Submit reading log entries and feedback to The Cozy Nook. Track your completed books and share your thoughts with our reading community.">
  <meta name="author" content="Gabriella Mujinga Ilunga">
  
 
  
  <link rel="icon" href="images/favicon.png" type="image/png">
  
 
  
  <meta property="og:title" content="The Cozy Nook | User Log">
  <meta property="og:description" content="Submit reading log entries and feedback to The Cozy Nook. Track your completed books and share your thoughts with our reading community.">
  <meta property="og:image" content="https://gabriellailunga.github.io/wdd231/Final-project/images/favicon.png">
  <meta property="og:url" content="https://gabriellailunga.github.io/wdd231/Final-project/log.html">
  <meta property="og:type" content="website">

 
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  
  
  <link rel="stylesheet" href="styles/small.css">
  <link rel="stylesheet" href="styles/large.css" media="(min-width: 700px)">

  
  
  <script src="scripts/log.js" defer></script>
</head>
<body>

  
  
  <header>
    <div class="logo-container">
      <p class="brand-title">The Cozy Nook</p>
      <p class="tagline">Your Sanctuary for Mystery, Thriller &amp; Romance</p>
    </div>
    <button id="hamburger-btn" aria-label="Toggle Navigation" aria-expanded="false">&#9776;</button>
    <nav id="primary-nav">
      <a href="index.html">Home</a>
      <a href="library.html">Library</a>
      <a href="tracker.html">Tracker</a>
      <a href="log.html" class="active">Log</a>
    </nav>
  </header>

  
  
  <main class="form-page">
    <h1>Client Reading Log &amp; Reviews</h1>

    <form id="log-form" class="form-container">
      <label for="reader-name">Reader Name</label>
      <input type="text" id="reader-name" name="readerName" required placeholder="Enter your full name">

      <label for="reader-email">Email Address</label>
      <input type="email" id="reader-email" name="readerEmail" required placeholder="name@example.com">

      <label for="favorite-genre">Primary Genre Preference</label>
      <select id="favorite-genre" name="favoriteGenre">
        <option value="Cozy Mystery">Cozy Mystery</option>
        <option value="Romantic Suspense">Romantic Suspense</option>
        <option value="Psychological Thriller">Psychological Thriller</option>
      </select>

      <label for="log-notes">Review / Reading Journal Entry</label>
      <textarea id="log-notes" name="logNotes" rows="5" required placeholder="Share your thoughts about books you have recently completed..."></textarea>

      <button type="submit" class="nook-btn-primary">Submit Journal Log</button>
    </form>

    <div id="log-confirmation" class="confirmation-msg"></div>
  </main>

 
  
  <footer>
    <p>&copy; 2026 Gabriella Mujinga Ilunga | The Cozy Nook</p>
    <p><span id="lastModified"></span></p>
  </footer>

</body>
</html>
