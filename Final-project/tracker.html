<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track your personal reading goals and progress with The Cozy Nook reading tracker.">
  <meta name="author" content="Gabriella Mujinga Ilunga">
  <title>The Cozy Nook | Reading Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/small.css">
  <link rel="stylesheet" href="styles/large.css" media="(min-width: 700px)">
  <script src="scripts/tracker.js" defer></script>
</head>
<body>
  <header>
    <div class="logo-container">
      <h1>The Cozy Nook</h1>
      <p class="tagline">Your Sanctuary for Mystery, Thriller &amp; Romance</p>
    </div>
    <button id="hamburger-btn" aria-label="Toggle Navigation" aria-expanded="false">&#9776;</button>
    <nav id="primary-nav">
      <a href="index.html">Home</a>
      <a href="library.html">Library</a>
      <a href="tracker.html" class="active">Tracker</a>
      <a href="log.html">Log</a>
    </nav>
  </header>

  <main>
    <h2>Reading Goal Tracker</h2>

    <section class="tracker-dashboard">
      <form id="tracker-form" class="form-container">
        <h3>Log New Progress</h3>

        <label for="book-title">Book Title</label>
        <input type="text" id="book-title" name="bookTitle" required placeholder="e.g. A Dark-Adapted Eye">

        <label for="pages-read">Pages Completed</label>
        <input type="number" id="pages-read" name="pagesRead" min="0" required placeholder="e.g. 150">

        <label for="reading-status">Current Status</label>
        <select id="reading-status" name="readingStatus">
          <option value="Currently Reading">Currently Reading</option>
          <option value="Completed">Completed</option>
          <option value="Want to Read">Want to Read</option>
        </select>

        <label for="rating">Rating (1 - 5 Stars)</label>
        <select id="rating" name="rating">
          <option value="5">&#9733;&#9733;&#9733;&#9733;&#9733; (5/5)</option>
          <option value="4">&#9733;&#9733;&#9733;&#9733;&#9734; (4/5)</option>
          <option value="3">&#9733;&#9733;&#9733;&#9734;&#9734; (3/5)</option>
          <option value="2">&#9733;&#9733;&#9734;&#9734;&#9734; (2/5)</option>
          <option value="1">&#9733;&#9734;&#9734;&#9734;&#9734; (1/5)</option>
        </select>

        <button type="submit" class="btn btn-primary">Save Goal Progress</button>
      </form>
    </section>

    <section class="tracker-history">
      <h3>Your Logged Reading Activity</h3>
      <div id="tracker-list" class="card-grid">
        <p class="empty-msg">No progress logged yet. Use the form above to record your reading milestones!</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Gabriella Mujinga Ilunga | The Cozy Nook</p>
    <p><span id="lastModified"></span></p>
  </footer>
</body>
</html>
